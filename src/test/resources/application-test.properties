# In-memory database for the application context smoke test only.
spring.datasource.url=jdbc:h2:mem:enigmas_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# Tests advance the server clock explicitly to avoid timing races.
game.trance.enabled=false
